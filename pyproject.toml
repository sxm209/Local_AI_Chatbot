[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-chatbot"
version = "0.1.0"
description = "Local-first desktop AI chatbot for private document search and cited answers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "platformdirs>=4.2.0",
  "pypdf>=4.3.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "keyring>=25.4.0",
]

[project.optional-dependencies]
vector = [
  "lancedb>=0.16.0",
  "fastembed>=0.4.0",
]
ocr = [
  "pytesseract>=0.3.13",
  "pillow>=10.4.0",
  "pdf2image>=1.17.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "pyinstaller>=6.10.0",
]

[project.scripts]
local-chatbot-backend = "local_chatbot.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/local_chatbot/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
