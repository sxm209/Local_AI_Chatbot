[package]
name = "local-chatbot"
version = "0.1.0"
description = "Local-first desktop AI chatbot for private document search."
authors = ["Local_Chatbot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_chatbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
